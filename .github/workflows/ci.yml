name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect visual regression changes
        id: visual-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="$BASE_SHA...$HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            diff_range="$BEFORE_SHA...$HEAD_SHA"
          fi

          changed_files="$(git diff --name-only "$diff_range")"
          if grep -Eq '^(packages/(element-plus|vue|core|shared)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/(ci|visual-regression-update)\.yml$)' <<< "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run reactive-vue tests with coverage
        run: pnpm --filter @silver-formily/reactive-vue test:coverage

      - name: Upload reactive-vue coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./packages/reactive-vue/coverage/coverage-final.json
          disable_search: true
          plugins: noop
          flags: reactive-vue
          fail_ci_if_error: true

      - name: Build publishable workspace packages
        run: |
          pnpm --filter @silver-formily/core build
          pnpm --filter @silver-formily/element-plus build
          pnpm --filter @silver-formily/grid build
          pnpm --filter @silver-formily/json-schema build
          pnpm --filter @silver-formily/path build
          pnpm --filter @silver-formily/reactive build
          pnpm --filter @silver-formily/reactive-vue build
          pnpm --filter @silver-formily/shared build
          pnpm --filter @silver-formily/validator build
          pnpm --filter @silver-formily/vant build
          pnpm --filter @silver-formily/vue build

      - name: Run FormItem visual regression tests
        if: ${{ steps.visual-changes.outputs.run == 'true' }}
        run: pnpm --filter @silver-formily/element-plus test:visual

      - name: Upload FormItem visual failure attachments
        if: ${{ failure() && steps.visual-changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: form-item-visual-failures-${{ github.run_id }}
          path: packages/element-plus/.vitest-attachments
          if-no-files-found: warn
          retention-days: 7

      - name: Run element-plus tests with coverage
        run: pnpm --filter @silver-formily/element-plus test:coverage

      - name: Upload element-plus coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./packages/element-plus/coverage/coverage-final.json
          disable_search: true
          plugins: noop
          flags: element-plus
          fail_ci_if_error: true
